# Until the cut-over: add this location INSIDE the existing Nginx server
# block for knowledge-hub.cloud (on CloudPanel: Sites › knowledge-hub.cloud ›
# Vhost), right above the catch-all `location / {`. v1 keeps answering
# everything else exactly as now.
#
# Prefix `/v2` (no trailing slash) on purpose: Next.js (basePath=/v2) itself
# redirects /v2/ → /v2, so a separate `/v2 → /v2/` redirect here would loop.
location /v2 {
  proxy_pass http://127.0.0.1:3100;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $http_connection;
  client_max_body_size 50m;
  proxy_read_timeout 120s;
}
