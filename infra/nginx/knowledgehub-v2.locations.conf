# Until the cut-over: add these locations INSIDE the existing Nginx server
# block for knowledge-hub.cloud (the HTTPS one that serves v1), above the
# catch-all `location /`. v1 keeps answering everything else exactly as now.
# Then: sudo nginx -t && sudo systemctl reload nginx

location = /v2 {
    return 301 /v2/;
}

location /v2/ {
    # No URI after the upstream: the /v2 prefix is passed through untouched
    # (the app is built with basePath=/v2).
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    client_max_body_size 50m;
    proxy_read_timeout 120s;
}
