<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section style="position:relative;height:100%;min-height:0;min-width:0;border-radius:30px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);color:#fbf8f5;">

  <div ref="{{ canvasRef }}" onPointerDown="{{ onDown }}" onPointerMove="{{ onMove }}" onPointerUp="{{ onUp }}" onPointerCancel="{{ onUp }}" onDoubleClick="{{ onDbl }}" onDragOver="{{ onDragOver }}" onDrop="{{ onDrop }}" onContextMenu="{{ noCtx }}" style="position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:{{ cursor }};background-image:radial-gradient(circle,rgba(255,255,255,.16) 1px,transparent 1.3px);background-size:{{ gridSize }};background-position:{{ gridPos }};">{{ world }}</div>

  <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;max-width:360px;text-align:center;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="rgba(255,248,240,.55)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L19 8a2.1 2.1 0 0 0-3-3L5 16z"></path><path d="M14 6l3 3"></path></svg>
        <span style="font-size:14px;line-height:1.5;color:rgba(255,248,240,.62);text-wrap:pretty;">{{ L.empty }}</span>
      </div>
    </div>
  </sc-if>

  <div style="position:absolute;top:14px;left:70px;right:70px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;">
  <div style="flex:none;pointer-events:auto;display:flex;align-items:center;gap:4px;height:44px;padding:0 6px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.1));backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 12px 32px rgba(0,0,0,.18);">
    <button onClick="{{ toggleBoards }}" title="{{ L.boards }}" style="width:32px;height:32px;border-radius:50%;border:0;background:{{ boardsBtnBg }};color:{{ boardsBtnFg }};cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect></svg></button>
    <input value="{{ boardName }}" onChange="{{ onBoardName }}" onKeyDown="{{ blurOnEnter }}" style="width:{{ boardNameW }};min-width:160px;max-width:560px;height:32px;padding:0 8px;border:0;border-radius:10px;background:transparent;color:#fbf8f5;font:inherit;font-size:14px;font-weight:600;outline:none;" style-focus="background:rgba(18,12,9,.25);">
    <span style="width:1px;height:20px;background:rgba(255,255,255,.18);margin:0 2px;"></span>
    <button onClick="{{ newBoard }}" title="{{ L.newBoard }}" style="width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:#fbf8f5;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;" style-hover="background:rgba(255,255,255,.12);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
    <button onClick="{{ exportSvg }}" title="{{ L.exportSvg }}" style="width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:#fbf8f5;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;" style-hover="background:rgba(255,255,255,.12);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg></button>
  </div>
  <sc-if value="{{ hasStyle }}" hint-placeholder-val="{{ false }}">
    <div onPointerDown="{{ stop }}" style="pointer-events:auto;max-width:100%;min-width:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px;min-height:44px;box-sizing:border-box;padding:6px 10px;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.1));backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 12px 32px rgba(0,0,0,.18);">
      <sc-if value="{{ st.hasStroke }}" hint-placeholder-val="{{ true }}">
        <div title="{{ L.color }}" style="display:flex;align-items:center;gap:4px;">
          <sc-for list="{{ st.inks }}" as="c" hint-placeholder-count="10"><button onClick="{{ c.onClick }}" style="width:20px;height:20px;flex:none;border-radius:50%;border:2px solid {{ c.ring }};background:{{ c.c }};cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);"></button></sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ st.hasFill }}" hint-placeholder-val="{{ false }}">
        <span style="width:1px;height:22px;flex:none;background:rgba(255,255,255,.18);"></span>
        <div title="{{ L.fill }}" style="display:flex;align-items:center;gap:4px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(255,248,240,.7)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-right:2px;"><path d="M5 11l7-7 7 7-7 7z"></path><path d="M19 16s2 2.4 2 3.5a2 2 0 0 1-4 0c0-1.1 2-3.5 2-3.5z"></path></svg>
          <sc-for list="{{ st.fills }}" as="c" hint-placeholder-count="11"><button onClick="{{ c.onClick }}" title="{{ c.tip }}" style="width:20px;height:20px;flex:none;border-radius:6px;border:2px solid {{ c.ring }};background:{{ c.c }};cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);"></button></sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ st.hasPaper }}" hint-placeholder-val="{{ false }}">
        <div title="{{ L.fill }}" style="display:flex;align-items:center;gap:4px;">
          <sc-for list="{{ st.papers }}" as="c" hint-placeholder-count="9"><button onClick="{{ c.onClick }}" style="width:20px;height:20px;flex:none;border-radius:5px;border:2px solid {{ c.ring }};background:{{ c.c }};cursor:pointer;padding:0;"></button></sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ st.hasSw }}" hint-placeholder-val="{{ false }}">
        <span style="width:1px;height:22px;flex:none;background:rgba(255,255,255,.18);"></span>
        <div title="{{ L.width }}" style="display:flex;align-items:center;gap:2px;">
          <sc-for list="{{ st.sws }}" as="w" hint-placeholder-count="4"><button onClick="{{ w.onClick }}" style="width:28px;height:28px;flex:none;border-radius:9px;border:0;background:{{ w.bg }};cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;"><span style="width:16px;height:{{ w.h }};border-radius:999px;background:{{ w.fg }};"></span></button></sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ st.hasDash }}" hint-placeholder-val="{{ false }}">
        <span style="width:1px;height:22px;flex:none;background:rgba(255,255,255,.18);"></span>
        <div title="{{ L.dash }}" style="display:flex;align-items:center;gap:2px;">
          <sc-for list="{{ st.dashes }}" as="w" hint-placeholder-count="3"><button onClick="{{ w.onClick }}" title="{{ w.tip }}" style="width:30px;height:28px;flex:none;border-radius:9px;border:0;background:{{ w.bg }};color:{{ w.fg }};cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;">{{ w.icon }}</button></sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ st.hasFs }}" hint-placeholder-val="{{ false }}">
        <span style="width:1px;height:22px;flex:none;background:rgba(255,255,255,.18);"></span>
        <div title="{{ L.size }}" style="display:flex;align-items:center;gap:2px;">
          <sc-for list="{{ st.fss }}" as="w" hint-placeholder-count="4"><button onClick="{{ w.onClick }}" style="min-width:28px;height:28px;flex:none;border-radius:9px;border:0;background:{{ w.bg }};color:{{ w.fg }};font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:0 6px;">{{ w.l }}</button></sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ st.hasSel }}" hint-placeholder-val="{{ false }}">
        <span style="width:1px;height:22px;flex:none;background:rgba(255,255,255,.18);"></span>
        <div style="display:flex;align-items:center;gap:2px;">
          <sc-for list="{{ st.acts }}" as="a" hint-placeholder-count="4"><button onClick="{{ a.onClick }}" title="{{ a.tip }}" style="width:30px;height:30px;flex:none;border-radius:50%;border:0;background:transparent;color:{{ a.fg }};cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;" style-hover="background:rgba(255,255,255,.12);">{{ a.icon }}</button></sc-for>
        </div>
      </sc-if>
    </div>
  </sc-if>
  </div>

  <sc-if value="{{ showBoards }}" hint-placeholder-val="{{ false }}">
    <div onPointerDown="{{ stop }}" style="position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:8;width:min(380px,calc(100% - 140px));max-height:calc(100% - 150px);display:flex;flex-direction:column;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.12));backdrop-filter:blur(34px) saturate(170%);-webkit-backdrop-filter:blur(34px) saturate(170%);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 24px 60px rgba(0,0,0,.3);overflow:hidden;">
      <div style="flex-shrink:0;display:flex;flex-direction:column;gap:10px;padding:14px 14px 10px;">
        <div style="display:flex;align-items:center;gap:8px;"><span style="font-size:15px;font-weight:600;margin-right:auto;">{{ L.boards }}</span><span style="font-size:12px;color:rgba(255,248,240,.62);">{{ boardsCount }}</span></div>
        <input value="{{ bq }}" onChange="{{ onBq }}" placeholder="{{ L.search }}" style="height:36px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(18,12,9,.25);color:#fbf8f5;font:inherit;font-size:13px;outline:none;">
      </div>
      <div style="flex:1;min-height:0;overflow:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:2px;">
        <sc-for list="{{ boardRows }}" as="r" hint-placeholder-count="3">
          <div onClick="{{ r.onOpen }}" style="flex-shrink:0;display:flex;align-items:center;gap:10px;padding:8px;border-radius:16px;cursor:pointer;background:{{ r.bg }};border:1px solid {{ r.bd }};" style-hover="background:rgba(255,255,255,.1);">
            <div style="width:68px;height:46px;flex:none;border-radius:10px;overflow:hidden;background:rgba(18,12,9,.35);border:1px solid rgba(255,255,255,.1);pointer-events:none;">{{ r.preview }}</div>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
              <span style="font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ r.name }}</span>
              <span style="font-size:11.5px;color:rgba(255,248,240,.6);white-space:nowrap;">{{ r.sub }}</span>
            </div>
            <button onClick="{{ r.onDup }}" title="{{ L.dup }}" style="width:28px;height:28px;flex:none;border-radius:50%;border:0;background:transparent;color:rgba(255,248,240,.75);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;" style-hover="background:rgba(255,255,255,.12);color:#fff;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2.5"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg></button>
            <button onClick="{{ r.onDel }}" title="{{ L.del }}" style="width:28px;height:28px;flex:none;border-radius:50%;border:0;background:transparent;color:rgba(255,200,184,.85);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;" style-hover="background:rgba(255,255,255,.12);color:#ffc9b8;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="M6 7l1 13h10l1-13"></path></svg></button>
          </div>
        </sc-for>
      </div>
      <div style="flex-shrink:0;padding:8px 14px 14px;">
        <button onClick="{{ newBoard }}" style="width:100%;height:38px;border-radius:999px;border:0;background:#fbf8f5;color:#2a211c;font:inherit;font-size:13px;font-weight:600;cursor:pointer;">+ {{ L.newBoard }}</button>
      </div>
    </div>
  </sc-if>

  <div style="position:absolute;left:14px;top:70px;max-height:calc(100% - 140px);overflow-y:auto;scrollbar-width:none;z-index:5;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.1));backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 12px 32px rgba(0,0,0,.18);">
    <sc-for list="{{ toolsA }}" as="b" hint-placeholder-count="2"><button onClick="{{ b.onClick }}" title="{{ b.title }}" style="width:34px;height:34px;flex-shrink:0;border-radius:11px;border:0;background:{{ b.bg }};color:{{ b.fg }};cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;" style-hover="background:{{ b.hov }};">{{ b.icon }}</button></sc-for>
    <span style="width:20px;height:1px;flex-shrink:0;background:rgba(255,255,255,.16);margin:2px 0;"></span>
    <sc-for list="{{ toolsB }}" as="b" hint-placeholder-count="3"><button onClick="{{ b.onClick }}" title="{{ b.title }}" style="width:34px;height:34px;flex-shrink:0;border-radius:11px;border:0;background:{{ b.bg }};color:{{ b.fg }};cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;" style-hover="background:{{ b.hov }};">{{ b.icon }}</button></sc-for>
    <span style="width:20px;height:1px;flex-shrink:0;background:rgba(255,255,255,.16);margin:2px 0;"></span>
    <sc-for list="{{ toolsC }}" as="b" hint-placeholder-count="5"><button onClick="{{ b.onClick }}" title="{{ b.title }}" style="width:34px;height:34px;flex-shrink:0;border-radius:11px;border:0;background:{{ b.bg }};color:{{ b.fg }};cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;" style-hover="background:{{ b.hov }};">{{ b.icon }}</button></sc-for>
    <span style="width:20px;height:1px;flex-shrink:0;background:rgba(255,255,255,.16);margin:2px 0;"></span>
    <sc-for list="{{ toolsD }}" as="b" hint-placeholder-count="4"><button onClick="{{ b.onClick }}" title="{{ b.title }}" style="width:34px;height:34px;flex-shrink:0;border-radius:11px;border:0;background:{{ b.bg }};color:{{ b.fg }};cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;" style-hover="background:{{ b.hov }};">{{ b.icon }}</button></sc-for>
    <span style="width:20px;height:1px;flex-shrink:0;background:rgba(255,255,255,.16);margin:2px 0;"></span>
    <button onClick="{{ toggleLock }}" title="{{ L.lock }}" style="width:34px;height:28px;flex-shrink:0;border-radius:10px;border:0;background:{{ lockBg }};color:{{ lockFg }};cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></button>
  </div>


  <div style="position:absolute;right:14px;bottom:14px;z-index:5;display:flex;align-items:center;gap:2px;height:40px;padding:0 4px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.1));backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 12px 32px rgba(0,0,0,.18);">
    <button onClick="{{ undo }}" title="{{ L.undo }}" style="width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:{{ undoFg }};cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;" style-hover="background:rgba(255,255,255,.12);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg></button>
    <button onClick="{{ redo }}" title="{{ L.redo }}" style="width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:{{ redoFg }};cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;" style-hover="background:rgba(255,255,255,.12);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"></path><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"></path></svg></button>
    <span style="width:1px;height:18px;background:rgba(255,255,255,.18);margin:0 3px;"></span>
    <button onClick="{{ zoomOut }}" title="{{ L.zoomOut }}" style="width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:#fbf8f5;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;" style-hover="background:rgba(255,255,255,.12);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
    <button onClick="{{ zoomReset }}" title="100%" style="min-width:52px;height:32px;border-radius:999px;border:0;background:transparent;color:#fbf8f5;font-family:'Geist Mono',monospace;font-size:12px;font-weight:600;cursor:pointer;padding:0 6px;" style-hover="background:rgba(255,255,255,.12);">{{ zoomLbl }}</button>
    <button onClick="{{ zoomIn }}" title="{{ L.zoomIn }}" style="width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:#fbf8f5;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;" style-hover="background:rgba(255,255,255,.12);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
    <button onClick="{{ fit }}" title="{{ L.fit }}" style="width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:#fbf8f5;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;" style-hover="background:rgba(255,255,255,.12);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5h4"></path><path d="M20 9V5h-4"></path><path d="M4 15v4h4"></path><path d="M20 15v4h-4"></path></svg></button>
  </div>

  <div style="position:absolute;left:14px;bottom:14px;z-index:5;">
    <button onClick="{{ toggleHelp }}" title="{{ L.help }}" style="width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.1));backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);color:#fbf8f5;font:inherit;font-size:15px;font-weight:600;cursor:pointer;">?</button>
  </div>
  <sc-if value="{{ help }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:14px;bottom:64px;z-index:6;width:340px;display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.12));backdrop-filter:blur(34px) saturate(170%);-webkit-backdrop-filter:blur(34px) saturate(170%);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 24px 60px rgba(0,0,0,.3);">
      <span style="font-size:15px;font-weight:600;">{{ L.help }}</span>
      <div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:12.5px;">
        <sc-for list="{{ keys }}" as="k" hint-placeholder-count="10"><span style="color:rgba(255,248,240,.8);">{{ k.l }}</span><span style="justify-self:end;font-family:'Geist Mono',monospace;font-size:11.5px;padding:1px 7px;border-radius:6px;background:rgba(18,12,9,.3);border:1px solid rgba(255,255,255,.12);white-space:nowrap;">{{ k.k }}</span></sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ linkOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeLink }}" onPointerDown="{{ stop }}" data-kv-dim="1" style="position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(18,12,9,.22);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);">
