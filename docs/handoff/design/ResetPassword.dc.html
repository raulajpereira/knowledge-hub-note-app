<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<link rel="icon" type="image/svg+xml" href="./favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><link rel="manifest" href="./site.webmanifest"><meta name="theme-color" content="#121315">
</head>
<body>
<x-dc>
<helmet><link rel="icon" type="image/svg+xml" href="./favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><link rel="manifest" href="./site.webmanifest"><meta name="theme-color" content="#121315"><title>KnowledgeHub</title><style>html,body{margin:0;background:#121315;}a{color:#fbf8f5;}a:hover{color:#fff;}input::placeholder{color:rgba(255,248,240,.42);}</style></helmet>
<div style="position:relative;min-height:100vh;box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:56px 96px;padding:96px clamp(24px,7vw,120px) 64px;background:radial-gradient(1100px 700px at 15% 20%,rgba(255,255,255,.07),transparent 60%),radial-gradient(900px 600px at 85% 85%,oklch(0.45 0.08 245 / .28),transparent 60%),linear-gradient(160deg,#1f2124,#17181b 55%,#121315);color:#fbf8f5;font-family:'Geist',system-ui,sans-serif;overflow:hidden;">
  <div style="position:absolute;top:24px;right:24px;display:flex;gap:2px;padding:3px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));backdrop-filter:blur(34px) saturate(160%);-webkit-backdrop-filter:blur(34px) saturate(160%);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 30px 80px rgba(0,0,0,.35);box-shadow:none;">
    <sc-for list="{{ langs }}" as="lg" hint-placeholder-count="2"><button type="button" onClick="{{ lg.onClick }}" style="height:28px;padding:0 12px;border-radius:999px;border:0;font:inherit;font-size:12px;font-weight:700;cursor:pointer;background:{{ lg.bg }};color:{{ lg.fg }};">{{ lg.label }}</button></sc-for>
  </div>
  <div style="flex:1 1 420px;max-width:580px;display:flex;flex-direction:column;gap:22px;">
    <div style="display:flex;align-items:center;gap:12px;"><svg width="44" height="44" viewBox="7 7 27 26" style="flex:none;display:block;filter:drop-shadow(0 4px 12px rgba(0,0,0,.25));"><defs><linearGradient id="kvba" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf9"></stop><stop offset="1" stop-color="#efe4d6"></stop></linearGradient><linearGradient id="kvka" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbf5"></stop><stop offset="1" stop-color="#e6d7c4"></stop></linearGradient><linearGradient id="kvga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fb8ff"></stop><stop offset="1" stop-color="#0a5cff"></stop></linearGradient></defs><path d="M11 24.5C8 23.5 7.2 19.8 8.9 17.3C8.4 13.6 11.3 10.4 15 10.8C16.6 8.5 20.4 7.8 22.9 9.4C25.6 8.3 29.1 9.6 30 12.4C32.6 13.3 33.6 16.5 32.3 18.8C33.3 21.6 31.4 24.6 28.4 24.8C29.2 27.3 27.2 29.1 24.8 28.4L24 31C23.7 31.9 22.5 32 22.1 31.2L20.8 27.6C16.8 27.9 14.6 27.3 13.4 25.7C12.6 25.6 11.7 25.1 11 24.5Z" fill="url(#kvka)"></path><g fill="none" stroke="#6b5646" stroke-width="1.1" stroke-linecap="round" opacity=".5"><path d="M12 16.4c1.7-.4 3.1.5 3.6 2"></path><path d="M16.6 12.6c.3 1.4 1.4 2.2 2.8 2.2"></path><path d="M26.8 12.2c-.5 1.4 0 2.8 1.3 3.6"></path><path d="M11.8 21.6c1.4.5 2.8.1 3.7-1"></path><path d="M29.6 20.2c-1.4.1-2.5 1-2.9 2.3"></path></g><path d="M20.6 14.4a2.9 2.9 0 0 1 1.5 5.38l.85 4.72a.8.8 0 0 1-.79.95h-3.12a.8.8 0 0 1-.79-.95l.85-4.72a2.9 2.9 0 0 1 1.5-5.38z" fill="url(#kvga)"></path></svg><span style="font-size:22px;font-weight:700;letter-spacing:-.02em;"><span>Knowledge</span><span style="color:oklch(0.76 0.17 245);">Hub</span></span></div>
    <span style="font-size:clamp(40px,5vw,64px);line-height:1.04;font-weight:600;letter-spacing:-.035em;text-wrap:balance;">{{ L.slogan }}</span>
  </div>
  <form onSubmit="{{ onSubmit }}" novalidate="" style="flex:0 1 420px;width:100%;max-width:420px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px;padding:34px;border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));backdrop-filter:blur(34px) saturate(160%);-webkit-backdrop-filter:blur(34px) saturate(160%);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 30px 80px rgba(0,0,0,.35);">
    <sc-if value="{{ isForm }}" hint-placeholder-val="{{ true }}">
      <span style="align-self:center;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fbf8f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span>
      <div style="display:flex;flex-direction:column;gap:6px;text-align:center;"><span style="font-size:24px;font-weight:600;letter-spacing:-.02em;">{{ L.title }}</span><span style="font-size:14px;color:rgba(255,248,240,.78);text-wrap:pretty;">{{ L.sub }} <b style="color:#fbf8f5;font-weight:600;">{{ email }}</b></span></div>
      <label style="display:flex;flex-direction:column;gap:7px;"><span style="font-size:12.5px;font-weight:600;color:rgba(255,248,240,.88);">{{ L.password }}</span><span style="position:relative;display:flex;"><input type="{{ pwType }}" value="{{ v.password }}" onChange="{{ on.password }}" placeholder="{{ L.passwordPh }}" autocomplete="new-password" style="height:46px;padding:0 16px;border-radius:14px;border:1px solid {{ bd.password }};background:rgba(0,0,0,.25);color:#fbf8f5;font:inherit;font-size:14.5px;outline:none;box-sizing:border-box;width:100%;padding-right:50px;" style-focus="border-color:rgba(255,255,255,.45);"><button type="button" onClick="{{ onEye }}" title="{{ L.eye }}" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:rgba(255,248,240,.8);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;"><sc-if value="{{ show }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1"></path><path d="M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.6 9.6 0 0 0 5.4-1.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg></sc-if><sc-if value="{{ hide }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if></button></span><sc-if value="{{ er.password }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:#ffc9b8;">{{ er.password }}</span></sc-if></label>
      <div style="display:flex;flex-direction:column;gap:6px;margin-top:-8px;">
      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;"><sc-for list="{{ strength }}" as="s" hint-placeholder-count="4"><span style="height:4px;border-radius:999px;background:{{ s }};"></span></sc-for></div>
      <span style="font-size:11.5px;color:rgba(255,248,240,.7);">{{ strengthLbl }}</span>
    </div>
      <label style="display:flex;flex-direction:column;gap:7px;"><span style="font-size:12.5px;font-weight:600;color:rgba(255,248,240,.88);">{{ L.confirm }}</span><span style="position:relative;display:flex;"><input type="{{ pwType }}" value="{{ v.confirm }}" onChange="{{ on.confirm }}" placeholder="{{ L.confirmPh }}" autocomplete="new-password" style="height:46px;padding:0 16px;border-radius:14px;border:1px solid {{ bd.confirm }};background:rgba(0,0,0,.25);color:#fbf8f5;font:inherit;font-size:14.5px;outline:none;box-sizing:border-box;width:100%;padding-right:50px;" style-focus="border-color:rgba(255,255,255,.45);"><button type="button" onClick="{{ onEye }}" title="{{ L.eye }}" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:rgba(255,248,240,.8);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;"><sc-if value="{{ show }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1"></path><path d="M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.6 9.6 0 0 0 5.4-1.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg></sc-if><sc-if value="{{ hide }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if></button></span><sc-if value="{{ er.confirm }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:#ffc9b8;">{{ er.confirm }}</span></sc-if></label>
      <ul style="margin:-4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:12.5px;">
        <sc-for list="{{ rules }}" as="r" hint-placeholder-count="3"><li style="display:flex;align-items:center;gap:8px;color:{{ r.c }};"><span style="width:16px;height:16px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:{{ r.bg }};font-size:10px;font-weight:700;color:#16131f;">{{ r.sym }}</span>{{ r.label }}</li></sc-for>
      </ul>
      <sc-if value="{{ hasMsg }}" hint-placeholder-val="{{ false }}"><div style="padding:10px 14px;border-radius:14px;background:{{ msgBg }};border:1px solid {{ msgBd }};font-size:13px;">{{ msg }}</div></sc-if>
      <button type="submit" style="height:48px;border-radius:999px;border:0;background:#fbf8f5;color:#2a211c;font:inherit;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;gap:8px;opacity:{{ busyOp }};" style-hover="background:#fff;">{{ L.submit }}</button>
      <span style="text-align:center;font-size:12.5px;line-height:1.5;color:rgba(255,248,240,.7);text-wrap:pretty;">{{ L.note }}</span>
    </sc-if>
    <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
      <span style="align-self:center;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:oklch(0.72 0.14 150 / .7);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fbf8f5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
      <div style="display:flex;flex-direction:column;gap:6px;text-align:center;"><span style="font-size:24px;font-weight:600;letter-spacing:-.02em;">{{ L.doneT }}</span><span style="font-size:14px;line-height:1.5;color:rgba(255,248,240,.8);text-wrap:pretty;">{{ L.doneS }}</span></div>
      <a href="Login.dc.html" style="height:48px;border-radius:999px;background:#fbf8f5;color:#2a211c;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 10px 30px rgba(0,0,0,.25);" style-hover="background:#fff;color:#2a211c;">{{ L.toLogin }}</a>
    </sc-if>
    <sc-if value="{{ isBad }}" hint-placeholder-val="{{ false }}">
      <span style="align-self:center;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:oklch(0.7 0.15 40 / .65);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fbf8f5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5"></path><path d="M12 16.5v.01"></path></svg></span>
      <div style="display:flex;flex-direction:column;gap:6px;text-align:center;"><span style="font-size:24px;font-weight:600;letter-spacing:-.02em;">{{ L.badT }}</span><span style="font-size:14px;line-height:1.5;color:rgba(255,248,240,.8);text-wrap:pretty;">{{ L.badS }}</span></div>
      <a href="Login.dc.html?forgot=1" style="height:48px;border-radius:999px;background:#fbf8f5;color:#2a211c;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 10px 30px rgba(0,0,0,.25);" style-hover="background:#fff;color:#2a211c;">{{ L.again }}</a>
    </sc-if>
    <span style="text-align:center;font-size:13.5px;color:rgba(255,248,240,.78);"><a href="Login.dc.html" style="color:#fbf8f5;font-weight:600;">← {{ L.back }}</a></span>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>class Component extends DCLogic {
  T = { pt: { slogan: 'O seu segundo cérebro, organizado.', title: 'Definir nova password', sub: 'Escolha uma nova password para', password: 'Nova password', passwordPh: 'Mínimo 8 caracteres', confirm: 'Confirmar password', confirmPh: 'Repita a password', eye: 'Mostrar/ocultar password', submit: 'Guardar nova password', note: 'Ao guardar, todas as sessões abertas noutros dispositivos são terminadas. A palavra-passe mestra do cofre de Passwords não muda.', ePw: 'A password precisa de pelo menos 8 caracteres.', eConf: 'As passwords não coincidem.', eSame: 'Escolha uma password diferente da atual.', r1: 'Pelo menos 8 caracteres', r2: 'Maiúsculas e minúsculas', r3: 'Um número ou símbolo', s: ['Muito fraca', 'Fraca', 'Razoável', 'Forte', 'Muito forte'], sNone: 'Força da password', doneT: 'Password alterada', doneS: 'A sua password foi atualizada e as outras sessões foram terminadas. Já pode iniciar sessão.', toLogin: 'Iniciar sessão', badT: 'Link inválido ou expirado', badS: 'Este link de recuperação já foi usado ou passou o prazo de 30 minutos. Peça um novo no ecrã de início de sessão.', again: 'Pedir novo link', back: 'Voltar ao início de sessão' },
    en: { slogan: 'Your second brain, organized.', title: 'Set a new password', sub: 'Choose a new password for', password: 'New password', passwordPh: 'At least 8 characters', confirm: 'Confirm password', confirmPh: 'Repeat the password', eye: 'Show/hide password', submit: 'Save New Password', note: 'Saving signs you out of every other device. Your Passwords vault master password does not change.', ePw: 'Password needs at least 8 characters.', eConf: 'Passwords do not match.', eSame: 'Choose a password different from your current one.', r1: 'At least 8 characters', r2: 'Upper and lower case', r3: 'A number or symbol', s: ['Very weak', 'Weak', 'Fair', 'Strong', 'Very strong'], sNone: 'Password strength', doneT: 'Password changed', doneS: 'Your password was updated and other sessions were signed out. You can sign in now.', toLogin: 'Sign In', badT: 'Invalid or expired link', badS: 'This recovery link was already used or is older than 30 minutes. Request a new one from the sign-in screen.', again: 'Request a new link', back: 'Back to sign in' } };
  state = (() => { const q = new URLSearchParams(location.search); const token = q.get('token') || ''; let tk = null; try { tk = JSON.parse(localStorage.getItem('kv.resetToken') || 'null'); } catch (e) {} const ok = !!tk && tk.token === token && Date.now() < tk.exp && !tk.used; return { lang: (() => { try { return localStorage.getItem('kv.authLang') || 'pt'; } catch (e) { return 'pt'; } })(), v: {}, er: {}, show: false, msg: '', ok: false, busy: false, stage: ok ? 'form' : 'bad', email: (tk && tk.email) || q.get('email') || '', token }; })();
  langs() { const l = this.state.lang; return [['pt', 'PT'], ['en', 'EN']].map(([k, lb]) => ({ label: lb, bg: l === k ? '#fbf8f5' : 'transparent', fg: l === k ? '#2a211c' : 'rgba(255,248,240,.82)', onClick: () => { try { localStorage.setItem('kv.authLang', k); } catch (e) {} this.setState({ lang: k, er: {}, msg: '' }); } })); }
  renderVals() {
    const S = this.state, L = this.T[S.lang] || this.T.pt, F = ['password', 'confirm'], er = {}, bd = {}, v = {}, on = {};
    F.forEach(k => { er[k] = (S.er || {})[k] || ''; bd[k] = er[k] ? 'rgba(255,170,150,.7)' : 'rgba(255,255,255,.16)'; v[k] = S.v[k] || ''; on[k] = e => { const x = e.target.value; this.setState(st => ({ v: { ...st.v, [k]: x }, er: { ...st.er, [k]: '' }, msg: '' })); }; });
    const pw = S.v.password || ''; let sc = 0; if (pw.length >= 8) sc++; if (pw.length >= 12) sc++; if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) sc++; if (/\d/.test(pw)) sc++; if (/[^A-Za-z0-9]/.test(pw)) sc++; sc = Math.min(4, sc);
    const SC = ['oklch(0.66 0.17 25)', 'oklch(0.72 0.15 50)', 'oklch(0.8 0.13 85)', 'oklch(0.78 0.14 150)', 'oklch(0.76 0.15 160)'];
    const rule = (ok, label) => ({ label, sym: ok ? '✓' : '', bg: ok ? 'oklch(0.8 0.14 150)' : 'rgba(255,255,255,.16)', c: ok ? '#fbf8f5' : 'rgba(255,248,240,.62)' });
    return { L, er, bd, v, on, langs: this.langs(), email: S.email, isForm: S.stage === 'form', isDone: S.stage === 'done', isBad: S.stage === 'bad',
      show: S.show, hide: !S.show, pwType: S.show ? 'text' : 'password', onEye: () => this.setState(st => ({ show: !st.show })),
      strength: [0, 1, 2, 3].map(i => pw && i < Math.max(1, sc) ? SC[sc] : 'rgba(255,255,255,.12)'), strengthLbl: pw ? L.s[sc] : L.sNone,
      rules: [rule(pw.length >= 8, L.r1), rule(/[A-Z]/.test(pw) && /[a-z]/.test(pw), L.r2), rule(/[\d\W_]/.test(pw), L.r3)],
      hasMsg: !!S.msg, msg: S.msg, msgBg: S.ok ? 'oklch(0.75 0.13 150 / .18)' : 'oklch(0.7 0.14 30 / .18)', msgBd: S.ok ? 'oklch(0.8 0.13 150 / .4)' : 'oklch(0.78 0.14 35 / .4)', busyOp: S.busy ? .6 : 1,
      onSubmit: async e => { e.preventDefault(); const er2 = {}; if (pw.length < 8) er2.password = L.ePw; if ((S.v.confirm || '') !== pw) er2.confirm = L.eConf; if (Object.keys(er2).length) return this.setState({ er: er2 });
        this.setState({ busy: true }); const hx = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('kh:' + pw))), x => x.toString(16).padStart(2, '0')).join('');
        try { localStorage.setItem('kv.authPassHash', hx); const tk = JSON.parse(localStorage.getItem('kv.resetToken') || 'null'); if (tk) { tk.used = true; localStorage.setItem('kv.resetToken', JSON.stringify(tk)); } localStorage.removeItem('kv.authUser'); sessionStorage.removeItem('kv.locked'); } catch (x) {}
        this.setState({ busy: false, stage: 'done', v: {} }); } };
  }
}</script>
</body>
</html>
