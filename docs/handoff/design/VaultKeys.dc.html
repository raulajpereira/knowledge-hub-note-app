<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:contents;">
<sc-if value="{{ isModal }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ onBackdrop }}" data-kv-dim="1" style="position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(20,14,10,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fbf8f5;">

      <div style="display:flex;align-items:flex-start;gap:14px;">
        <span style="width:46px;height:46px;flex:none;border-radius:15px;display:flex;align-items:center;justify-content:center;background:{{ icoBg }};border:1px solid rgba(255,255,255,.22);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"></circle><path d="M10.8 12.2L20 3"></path><path d="M16 7l3 3"></path><path d="M14 9l2 2"></path></svg></span>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;"><span style="font-size:21px;font-weight:600;letter-spacing:-.02em;">{{ title }}</span><span style="font-size:13.5px;line-height:1.5;color:rgba(255,248,240,.8);text-wrap:pretty;">{{ sub }}</span></div>
        <sc-if value="{{ canClose }}" hint-placeholder-val="{{ true }}"><button onClick="{{ onClose }}" style="width:34px;height:34px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fbf8f5;cursor:pointer;padding:0;">×</button></sc-if>
      </div>
      <sc-if value="{{ hasSteps }}" hint-placeholder-val="{{ false }}"><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;"><sc-for list="{{ steps }}" as="s" hint-placeholder-count="3"><div style="display:flex;flex-direction:column;gap:6px;"><span style="height:4px;border-radius:999px;background:{{ s.bar }};"></span><span style="font-size:11.5px;font-weight:600;color:{{ s.fg }};">{{ s.label }}</span></div></sc-for></div></sc-if>

      <sc-if value="{{ showKey }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:18px;background:rgba(14,10,8,.35);border:1px dashed rgba(255,255,255,.3);">
          <span style="font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,248,240,.7);">{{ L.keyLbl }}</span>
          <span style="font-family:'Geist Mono',monospace;font-size:15px;font-weight:600;line-height:1.7;letter-spacing:.06em;word-break:break-all;">{{ key }}</span>
          <span style="font-family:'Geist Mono',monospace;font-size:11.5px;color:rgba(255,248,240,.65);">{{ L.fp }} {{ fp }}</span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;">
          <button onClick="{{ onDownload }}" style="white-space:nowrap;flex:none;height:42px;padding:0 18px;border-radius:999px;border:0;background:#fbf8f5;color:#2a211c;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg>{{ L.download }}</button>
          <button onClick="{{ onCopyKey }}" style="white-space:nowrap;flex:none;height:42px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fbf8f5;font:inherit;font-size:13px;font-weight:600;cursor:pointer;">{{ copyLbl }}</button>
        </div>
        <div style="display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:oklch(0.7 0.14 50 / .16);border:1px solid oklch(0.78 0.14 55 / .4);font-size:12.5px;line-height:1.5;"><span>⚠</span><span>{{ L.warn }}</span></div>

      <sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}"><div style="padding:10px 14px;border-radius:14px;background:oklch(0.66 0.17 25 / .2);border:1px solid oklch(0.72 0.16 25 / .45);font-size:13px;">{{ err }}</div></sc-if>
      <sc-if value="{{ hasOk }}" hint-placeholder-val="{{ false }}"><div style="padding:10px 14px;border-radius:14px;background:oklch(0.75 0.13 150 / .2);border:1px solid oklch(0.82 0.13 150 / .45);font-size:13px;">{{ ok }}</div></sc-if>
      <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;width:100%;min-width:0;">
        <sc-if value="{{ hasAlt }}" hint-placeholder-val="{{ false }}"><button onClick="{{ onAlt }}" style="white-space:nowrap;flex:none;margin-right:auto;height:44px;padding:0 14px;border-radius:999px;border:1px solid {{ altBd }};background:transparent;color:{{ altFg }};font:inherit;font-size:13px;font-weight:600;cursor:pointer;">{{ altLbl }}</button></sc-if>
        <button onClick="{{ onPrimary }}" style="white-space:nowrap;flex:none;height:44px;padding:0 22px;border-radius:999px;border:0;background:{{ priBg }};color:#2a211c;font:inherit;font-size:14px;font-weight:700;cursor:{{ priCur }};opacity:{{ priOp }};">{{ priLbl }}</button>
      </div>
    </div>
  </div>
</sc-if>

<sc-if value="{{ isSettings }}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;flex-direction:column;gap:16px;color:#fbf8f5;">
    <div style="display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);">
      <span style="width:42px;height:42px;flex:none;border-radius:13px;display:flex;align-items:center;justify-content:center;background:{{ st.bg }};"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"></circle><path d="M10.8 12.2L20 3"></path><path d="M16 7l3 3"></path></svg></span>
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;"><span style="font-size:14.5px;font-weight:600;">{{ st.title }}</span><span style="font-family:'Geist Mono',monospace;font-size:12px;color:rgba(255,248,240,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ st.sub }}</span></span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;">
      <sc-for list="{{ st.acts }}" as="a" hint-placeholder-count="3"><button onClick="{{ a.onClick }}" style="display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:16px;border:1px solid {{ a.bd }};background:rgba(255,255,255,.05);color:#fbf8f5;font:inherit;text-align:left;cursor:pointer;" style-hover="background:rgba(255,255,255,.1);"><span style="font-size:13.5px;font-weight:600;color:{{ a.fg }};">{{ a.label }}</span><span style="font-size:12px;line-height:1.4;color:rgba(255,248,240,.7);">{{ a.sub }}</span></button></sc-for>
    </div>
  </div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;mode&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;settings&quot;, &quot;setup&quot;, &quot;recover&quot;], &quot;default&quot;: &quot;settings&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;lang&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;pt&quot;, &quot;en&quot;], &quot;default&quot;: &quot;pt&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;pass&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;string&quot;}, &quot;onClose&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;(r) =&gt; void&quot;}}">

const vkSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const VK_T = {

Chave de recuperação ativa', stOff: 'Sem chave de recuperação', stOffSub: 'Gere uma chave para poder recuperar o cofre', created: 'criada a', aCh: 'Alterar palavra-passe mestra', aChS: 'Requer a palavra-passe atual', aDl: 'Descarregar Recovery Kit', aDlS: 'Volte a guardar a chave atual', aRg: 'Gerar nova chave', aRgS: 'Invalida a chave anterior', aNew: 'Gerar chave de recuperação', aNewS: 'Recomendado: sem ela não há recuperação', kitTitle: 'KnowledgeHub — Recovery Kit do cofre de passwords', kitWarn: 'Guarde este ficheiro num local seguro. Quem tiver esta chave pode redefinir a palavra-passe mestra do seu cofre.' },
  en: { setupT: 'Save your recovery key', setupS: 'It is the only way to recover the vault if you forget the master password. Not even we can recover it.', s1: 'Password', s2: 'Key', s3: 'Done', keyLbl: 'Recovery key', fp: 'Fingerprint', download: 'Download Recovery Kit', copy: 'Copy key', copied: 'Copied ✓', warn: 'Store the file somewhere safe outside KnowledgeHub (USB drive, physical safe, printout). Without this key, a forgotten password means losing all your passwords.', ack: 'I saved the recovery key somewhere safe', finish: 'Finish', recT: 'Recover your vault', recS: 'Upload the Recovery Kit or paste the recovery key to set a new master password. Your passwords are kept.', keyIn: 'Recovery key', keyPh: 'KHRK-XXXX-XXXX-…', upload: 'Upload Recovery Kit (.txt)', newPass: 'New master password', newPh: 'At least 8 characters', conf: 'Confirm password', recover: 'Recover vault', noKey: "I don't have the key", badKey: 'This key does not match your vault.', badFmt: 'Invalid key format.', short: 'The password needs at least 8 characters.', mismatch: 'Passwords do not match.', recovered: 'Vault recovered. New password set.', wipeQ: 'Without the recovery key your passwords cannot be recovered. Delete the vault and start over? This cannot be undone.', chT: 'Change master password', chS: 'Inside the vault you can change the password at any time. The recovery key stays valid.', cur: 'Current password', change: 'Change', badCur: 'The current password is wrong.', changed: 'Master password changed.', dlT: 'Download Recovery Kit', dlS: 'Confirm your master password to download the key again.', unlock: 'Show key', rgT: 'Generate new key', rgS: 'The previous key stops working. You will need to save the new one.', regen: 'Generate new key', cancel: 'Cancel', stOn: 'Recovery key active', stOff: 'No recovery key', stOffSub: 'Generate a key so you can recover the vault', created: 'created on', aCh: 'Change master password', aChS: 'Requires the current password', aDl: 'Download Recovery Kit', aDlS: 'Save the current key again', aRg: 'Generate new key', aRgS: 'Invalidates the previous key', aNew: 'Generate recovery key', aNewS: 'Recommended: without it there is no recovery', kitTitle: 'KnowledgeHub — Password Vault Recovery Kit', kitWarn: 'Keep this file somewhere safe. Anyone with this key can reset your vault master password.' }
};
