<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<link rel="icon" type="image/svg+xml" href="./favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><link rel="manifest" href="./site.webmanifest"><meta name="theme-color" content="#121315">
</head>
<body>
<x-dc>
<helmet><link rel="icon" type="image/svg+xml" href="./favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><link rel="manifest" href="./site.webmanifest"><meta name="theme-color" content="#121315"><title>KnowledgeHub</title><style>html,body{margin:0;background:#121315;}a{color:#fbf8f5;}a:hover{color:#fff;}input::placeholder{color:rgba(255,248,240,.42);}</style></helmet>
<div style="position:relative;min-height:100vh;box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:56px 96px;padding:96px clamp(24px,7vw,120px) 64px;background:radial-gradient(1100px 700px at 15% 20%,rgba(255,255,255,.07),transparent 60%),radial-gradient(900px 600px at 85% 85%,oklch(0.45 0.08 245 / .28),transparent 60%),linear-gradient(160deg,#1f2124,#17181b 55%,#121315);color:#fbf8f5;font-family:'Geist',system-ui,sans-serif;overflow:hidden;">
  <div style="position:absolute;top:24px;right:24px;display:flex;gap:2px;padding:3px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));backdrop-filter:blur(34px) saturate(160%);-webkit-backdrop-filter:blur(34px) saturate(160%);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 30px 80px rgba(0,0,0,.35);box-shadow:none;">
    <sc-for list="{{ langs }}" as="lg" hint-placeholder-count="2"><button type="button" onClick="{{ lg.onClick }}" style="height:28px;padding:0 12px;border-radius:999px;border:0;font:inherit;font-size:12px;font-weight:700;cursor:pointer;background:{{ lg.bg }};color:{{ lg.fg }};">{{ lg.label }}</button></sc-for>
  </div>
  <div style="flex:1 1 420px;max-width:580px;display:flex;flex-direction:column;gap:22px;">
    <div style="display:flex;align-items:center;gap:12px;"><svg width="44" height="44" viewBox="7 7 27 26" style="flex:none;display:block;filter:drop-shadow(0 4px 12px rgba(0,0,0,.25));"><defs><linearGradient id="kvba" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf9"></stop><stop offset="1" stop-color="#efe4d6"></stop></linearGradient><linearGradient id="kvka" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbf5"></stop><stop offset="1" stop-color="#e6d7c4"></stop></linearGradient><linearGradient id="kvga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fb8ff"></stop><stop offset="1" stop-color="#0a5cff"></stop></linearGradient></defs><path d="M11 24.5C8 23.5 7.2 19.8 8.9 17.3C8.4 13.6 11.3 10.4 15 10.8C16.6 8.5 20.4 7.8 22.9 9.4C25.6 8.3 29.1 9.6 30 12.4C32.6 13.3 33.6 16.5 32.3 18.8C33.3 21.6 31.4 24.6 28.4 24.8C29.2 27.3 27.2 29.1 24.8 28.4L24 31C23.7 31.9 22.5 32 22.1 31.2L20.8 27.6C16.8 27.9 14.6 27.3 13.4 25.7C12.6 25.6 11.7 25.1 11 24.5Z" fill="url(#kvka)"></path><g fill="none" stroke="#6b5646" stroke-width="1.1" stroke-linecap="round" opacity=".5"><path d="M12 16.4c1.7-.4 3.1.5 3.6 2"></path><path d="M16.6 12.6c.3 1.4 1.4 2.2 2.8 2.2"></path><path d="M26.8 12.2c-.5 1.4 0 2.8 1.3 3.6"></path><path d="M11.8 21.6c1.4.5 2.8.1 3.7-1"></path><path d="M29.6 20.2c-1.4.1-2.5 1-2.9 2.3"></path></g><path d="M20.6 14.4a2.9 2.9 0 0 1 1.5 5.38l.85 4.72a.8.8 0 0 1-.79.95h-3.12a.8.8 0 0 1-.79-.95l.85-4.72a2.9 2.9 0 0 1 1.5-5.38z" fill="url(#kvga)"></path></svg><span style="font-size:22px;font-weight:700;letter-spacing:-.02em;"><span>Knowledge</span><span style="color:oklch(0.76 0.17 245);">Hub</span></span></div>
    <span style="font-size:clamp(40px,5vw,64px);line-height:1.04;font-weight:600;letter-spacing:-.035em;text-wrap:balance;">{{ L.slogan }}</span>
  </div>
  <form onSubmit="{{ onSubmit }}" novalidate="" style="flex:0 1 420px;width:100%;max-width:420px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px;padding:34px;border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));backdrop-filter:blur(34px) saturate(160%);-webkit-backdrop-filter:blur(34px) saturate(160%);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 30px 80px rgba(0,0,0,.35);">
    <div style="display:flex;flex-direction:column;gap:6px;"><span style="font-size:24px;font-weight:600;letter-spacing:-.02em;">{{ L.title }}</span><span style="font-size:14px;color:rgba(255,248,240,.75);">{{ L.sub }}</span></div>
    <label style="display:flex;flex-direction:column;gap:7px;"><span style="font-size:12.5px;font-weight:600;color:rgba(255,248,240,.88);">{{ L.email }}</span><input type="email" value="{{ v.email }}" onChange="{{ on.email }}" placeholder="{{ L.emailPh }}" autocomplete="email" style="height:46px;padding:0 16px;border-radius:14px;border:1px solid {{ bd.email }};background:rgba(0,0,0,.25);color:#fbf8f5;font:inherit;font-size:14.5px;outline:none;box-sizing:border-box;width:100%;" style-focus="border-color:rgba(255,255,255,.45);"><sc-if value="{{ er.email }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:#ffc9b8;">{{ er.email }}</span></sc-if></label>
    <label style="display:flex;flex-direction:column;gap:7px;"><span style="font-size:12.5px;font-weight:600;color:rgba(255,248,240,.88);">{{ L.password }}</span><span style="position:relative;display:flex;"><input type="{{ pwType }}" value="{{ v.password }}" onChange="{{ on.password }}" placeholder="{{ L.passwordPh }}" autocomplete="current-password" style="height:46px;padding:0 16px;border-radius:14px;border:1px solid {{ bd.password }};background:rgba(0,0,0,.25);color:#fbf8f5;font:inherit;font-size:14.5px;outline:none;box-sizing:border-box;width:100%;padding-right:50px;" style-focus="border-color:rgba(255,255,255,.45);"><button type="button" onClick="{{ onEye }}" title="{{ L.eye }}" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:rgba(255,248,240,.8);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;"><sc-if value="{{ show }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1"></path><path d="M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.6 9.6 0 0 0 5.4-1.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg></sc-if><sc-if value="{{ hide }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if></button></span><sc-if value="{{ er.password }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:#ffc9b8;">{{ er.password }}</span></sc-if></label>
    <div style="display:flex;align-items:center;gap:10px;">
      <button type="button" onClick="{{ onRemember }}" style="display:flex;align-items:center;gap:10px;padding:0;border:0;background:transparent;color:rgba(255,248,240,.88);font:inherit;font-size:13.5px;cursor:pointer;"><span style="width:18px;height:18px;border-radius:6px;box-sizing:border-box;border:1.5px solid {{ remBd }};background:{{ remBg }};color:#2a211c;display:flex;align-items:center;justify-content:center;"><sc-if value="{{ remember }}" hint-placeholder-val="{{ true }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></span>{{ L.remember }}</button>
      <a href="#" onClick="{{ onForgot }}" style="margin-left:auto;font-size:13px;color:rgba(255,248,240,.82);">{{ L.forgot }}</a>
    </div>
    <sc-if value="{{ hasMsg }}" hint-placeholder-val="{{ false }}"><div style="padding:10px 14px;border-radius:14px;background:{{ msgBg }};border:1px solid {{ msgBd }};font-size:13px;">{{ msg }}</div></sc-if><sc-if value="{{ hasDemo }}" hint-placeholder-val="{{ false }}"><a href="{{ demoLink }}" style="margin-top:-8px;font-size:12.5px;color:#fbf8f5;text-align:center;">{{ L.demoLink }} →</a></sc-if>
    <button type="submit" style="height:48px;border-radius:999px;border:0;background:#fbf8f5;color:#2a211c;font:inherit;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;gap:8px;opacity:{{ busyOp }};" style-hover="background:#fff;">{{ L.submit }}</button>
    
    
    <span style="text-align:center;font-size:13.5px;color:rgba(255,248,240,.78);">{{ L.noAcc }} <a href="Register.dc.html" style="color:#fbf8f5;font-weight:600;">{{ L.toReg }}</a></span>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>class Component extends DCLogic {
  T = { pt: { slogan: 'O seu segundo cérebro, organizado.', title: 'Bem-vindo de volta', sub: 'Inicie sessão no KnowledgeHub', email: 'Email', emailPh: 'nome@empresa.pt', password: 'Password', passwordPh: '••••••••', eye: 'Mostrar/ocultar password', remember: 'Lembrar-me', forgot: 'Esqueceu-se da password?', submit: 'Entrar', or: 'ou', google: 'Entrar com Google', noAcc: 'Ainda não tem conta?', toReg: 'Criar conta', eEmail: 'Indique um email válido.', ePw: 'Indique a password.', ok: 'Sessão iniciada. A abrir o KnowledgeHub…', forgotMsg: 'Enviámos instruções para recuperar a password para o seu email.', forgotNeed: 'Escreva primeiro o seu email.', googleMsg: 'A autenticação Google fica disponível na versão publicada.', demoLink: 'Protótipo: abrir o link que seria enviado por email', bad: 'Email ou password incorretos.', wait: 'Demasiadas tentativas. Tente de novo dentro de {s}s.' },
    en: { slogan: 'Your second brain, organized.', title: 'Welcome back', sub: 'Sign in to KnowledgeHub', email: 'Email', emailPh: 'name@company.com', password: 'Password', passwordPh: '••••••••', eye: 'Show/hide password', remember: 'Remember me', forgot: 'Forgot password?', submit: 'Sign In', or: 'or', google: 'Sign in with Google', noAcc: "Don't have an account?", toReg: 'Create account', eEmail: 'Enter a valid email.', ePw: 'Enter your password.', ok: 'Signed in. Opening KnowledgeHub…', forgotMsg: 'We sent password recovery instructions to your email.', forgotNeed: 'Enter your email first.', googleMsg: 'Google sign-in will be available in the published version.', demoLink: 'Prototype: open the link that would be emailed', bad: 'Incorrect email or password.', wait: 'Too many attempts. Try again in {s}s.' } };
  state = { lang: (() => { try { return localStorage.getItem('kv.authLang') || 'pt'; } catch (e) { return 'pt'; } })(), v: { email: (() => { try { return localStorage.getItem('kv.authEmail') || ''; } catch (e) { return ''; } })() }, er: {}, show: false, remember: true, msg: '', ok: false, busy: false };
  langs() { const l = this.state.lang; return [['pt', 'PT'], ['en', 'EN']].map(([k, lb]) => ({ label: lb, bg: l === k ? '#fbf8f5' : 'transparent', fg: l === k ? '#2a211c' : 'rgba(255,248,240,.82)', onClick: () => { try { localStorage.setItem('kv.authLang', k); } catch (e) {} this.setState({ lang: k, er: {}, msg: '' }); } })); }
  base(F) { const S = this.state, L = this.T[S.lang] || this.T.pt; const er = {}, bd = {}, v = {}, on = {}; F.forEach(k => { er[k] = (S.er || {})[k] || ''; bd[k] = er[k] ? 'rgba(255,170,150,.7)' : 'rgba(255,255,255,.16)'; v[k] = S.v[k] || ''; on[k] = e => { const x = e.target.value; this.setState(st => ({ v: { ...st.v, [k]: x }, er: { ...st.er, [k]: '' }, msg: '' })); }; });
    return { L, er, bd, v, on, langs: this.langs(), show: S.show, hide: !S.show, pwType: S.show ? 'text' : 'password', onEye: () => this.setState(st => ({ show: !st.show })), hasDemo: !!S.demoLink && S.ok, demoLink: S.demoLink || '', hasMsg: !!S.msg, msg: S.msg, msgBg: S.ok ? 'oklch(0.75 0.13 150 / .18)' : 'oklch(0.7 0.14 30 / .18)', msgBd: S.ok ? 'oklch(0.8 0.13 150 / .4)' : 'oklch(0.78 0.14 35 / .4)', busyOp: S.busy ? .6 : 1, onGoogle: () => this.setState({ msg: L.googleMsg, ok: true }) }; }
  okEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e || ''); }
  renderVals() { const S = this.state, b = this.base(['email', 'password']), L = b.L;
    return { ...b, remember: S.remember, remBg: S.remember ? '#fbf8f5' : 'transparent', remBd: S.remember ? '#fbf8f5' : 'rgba(255,255,255,.4)', onRemember: () => this.setState(st => ({ remember: !st.remember })),
      onForgot: e => { e.preventDefault(); if (!this.okEmail(S.v.email)) return this.setState({ er: { email: L.forgotNeed }, msg: '' }); const tok = Array.from(crypto.getRandomValues(new Uint8Array(16)), x => x.toString(16).padStart(2, '0')).join(''); try { localStorage.setItem('kv.resetToken', JSON.stringify({ token: tok, email: S.v.email.trim().toLowerCase(), exp: Date.now() + 30 * 60000, used: false })); } catch (x) {} this.setState({ msg: L.forgotMsg, ok: true, demoLink: 'ResetPassword.dc.html?token=' + tok }); },
      onSubmit: async e => { e.preventDefault(); const er = {}; if (!this.okEmail(S.v.email)) er.email = L.eEmail; if (!S.v.password) er.password = L.ePw; if (Object.keys(er).length) return this.setState({ er, msg: '' }); const hx = async s => Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s))), b => b.toString(16).padStart(2, '0')).join(''); let stored = ''; try { stored = localStorage.getItem('kv.authPassHash') || ''; } catch (x) {} if (!stored) stored = '__default'; const okPw = stored === '__default' ? S.v.password === 'admin' : (await hx('kh:' + S.v.password)) === stored; const now = Date.now(); if ((this._until || 0) > now) return this.setState({ er: {}, msg: L.wait.replace('{s}', Math.ceil((this._until - now) / 1000)), ok: false }); if (S.v.email.trim().toLowerCase() !== 'raul.a.j.pereira@gmail.com' || !okPw) { this._fails = (this._fails || 0) + 1; if (this._fails >= 5) { this._fails = 0; this._until = Date.now() + 30000; } return this.setState({ er: {}, msg: L.bad, ok: false }); } try { localStorage.setItem('kv.authUser', JSON.stringify({ name: 'Raul Pereira', email: 'raul.a.j.pereira@gmail.com', ts: Date.now() })); sessionStorage.removeItem('kv.locked'); if (S.remember) localStorage.setItem('kv.authEmail', S.v.email); else localStorage.removeItem('kv.authEmail'); } catch (x) {} this.setState({ busy: true, msg: L.ok, ok: true }); setTimeout(() => { window.location.href = 'ZNotes.dc.html'; }, 700); } }; }
}</script>
</body>
</html>
