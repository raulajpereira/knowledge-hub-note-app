name: Deploy v1 to VPS

# Knowledge Hub v1 (frozen), served at https://knowledge-hub.cloud/v1 from its
# own checkout on the VPS (secret VPS_APP_DIR_V1), with BASE_PATH=/v1 and
# PM2_NAME=knowledge-hub-v1 in that checkout's server/.env. The new app (v2)
# deploys separately from its own branch into VPS_APP_DIR.
on:
  push:
    branches: [v1]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Refresh the repo (and thus deploy.sh itself) before running it, so a
          # run always executes the current deploy script instead of the stale
          # on-disk copy from the previous deploy.
          script: |
            set -e
            if [ -z "${{ secrets.VPS_APP_DIR_V1 }}" ]; then
              echo "VPS_APP_DIR_V1 secret not set — skipping v1 deploy."
              exit 0
            fi
            cd ${{ secrets.VPS_APP_DIR_V1 }}
            # Force the checkout to match origin/v1. `git pull` fails when a
            # previous `npm install` has left server/package-lock.json dirty;
            # reset --hard discards such tracked-file edits. No `git clean`, so
            # untracked uploads (avatars, logos, voice, note images) are kept.
            git fetch origin v1
            git checkout -B v1 origin/v1
            git reset --hard origin/v1
            DEPLOY_BRANCH=v1 bash deploy.sh
          debug: true
